version: 2

builds:
  - binary: opencode-usage
    main: ./cmd/opencode-usage
    ldflags:
      - -s -w
      - -X github.com/emmmdty/opencode-usage/internal/version.Version={{.Version}}
      - -X github.com/emmmdty/opencode-usage/internal/version.Commit={{.ShortCommit}}
      - -X github.com/emmmdty/opencode-usage/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
