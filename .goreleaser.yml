version: 2

builds:
  - binary: opencode-usage
    main: ./cmd/opencode-usage
    ldflags:
      - -s -w
      - -X github.com/emmmdty/opencode-usage/internal/version.Version={{.Version}}
      - -X github.com/emmmdty/opencode-usage/internal/version.Commit={{.ShortCommit}}
      - -X github.com/emmmdty/opencode-usage/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: packages
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
  # Raw binaries: `ou update` downloads these directly (no unpack step).
  # goreleaser preserves the .exe extension for Windows binaries automatically.
  - id: binaries
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
